{% extends 'base.html' %}

{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Question!</title>
    <style>
        /* Colorful, fun background gradient */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff007f, #ff7f00, #ffea00, #00ff7f, #007fff, #7f00ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Arial Black', Impact, sans-serif;
            overflow: hidden;
        }

        /* Smooth background color shift animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Big, bold glassmorphic container */
        .quiz-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        /* Big, colorful question text */
        h1 {
            font-size: 4rem;
            color: #ffffff;
            text-shadow: 3px 3px 0px #000, -2px -2px 0px #000;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* Button container */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            position: relative;
            min-height: 80px;
            width: 400px;
        }

        /* Base button styles */
        .btn {
            font-size: 2rem;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        /* "Yes" Button styles */
        #yesBtn {
            background-color: #00ffcc;
            color: #333;
        }

        #yesBtn:hover {
            transform: scale(1.2);
            background-color: #fff;
        }

        /* "No" Button styles - absolute positioning allows it to fly around */
        #noBtn {
            background-color: #ff3366;
            color: white;
            position: absolute;
            left: 240px; /* Initial position next to Yes */
        }
    </style>
</head>
<body>

    <div class="quiz-box">
        <h1> MAXKILL IS GAY<br>
            ARE YOU GAY? 🌈</h1>
        <div class="btn-container">
            <button class="btn" id="yesBtn" onclick="confettiExplosion()">YES</button>
            <button class="btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">NO</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        // Function that teleports the "No" button randomly across the viewport
        function moveButton() {
            // Calculate random positions, leaving a margin so it doesn't leave the screen completely
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;

            // Apply new position and change position type to fixed so it can go anywhere
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Action when they finally click "Yes"
        function confettiExplosion() {
            alert("I knew it! 🎉 Happy Pride! 🌈");
            // Reset the button back to the container after they click yes
            noBtn.style.position = 'absolute';
            noBtn.style.left = '240px';
            noBtn.style.top = 'auto';
        }
    </script>

</body>
</html>

{% endblock %}
