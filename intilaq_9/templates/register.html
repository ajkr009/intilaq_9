{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>Create Account</h2>
    <form method="POST" action="">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" value="{{ request.POST.username }}" placeholder="Choose username" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" value="{{ request.POST.email }}" placeholder="Enter email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Create password" required>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn-submit">Register</button>
    </form>
    <div class="form-footer">
        Already registered? <a href="{% url 'login' %}">Login here</a>
    </div>
</div>
{% endblock %}
